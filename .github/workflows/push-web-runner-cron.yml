name: Web Runner
on:
  pull_request:
    branches:
      - web-runner-cron
  push:
    branches:
      - web-runner-cron

jobs:
  master:
    strategy:
      matrix:
        step: ['web-runner:build-zip']
    name: ${{ matrix.step }}
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0
        token: ${{ secrets.GH_PAT }}
    - name: ${{ matrix.step }}
      env:
        CC_TEST_REPORTER_ID: ${{ secrets.CC_TEST_REPORTER_ID }}
        GH_PAT: ${{ secrets.GH_PAT }}
        GH_RELEASE_GITHUB_API_TOKEN: ${{ secrets.GH_PAT }}
        GH_RELEASE_FILES: master-build.zip,master-src.zip
        DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        TRANSAK_API_KEY: ${{ secrets.TRANSAK_API_KEY }}
        COINBASE_PAY_ID: ${{ secrets.COINBASE_PAY_ID }}
        BITTENSOR_API_KEY_1: ${{ secrets.BITTENSOR_API_KEY_1 }}
        BITTENSOR_API_KEY_2: ${{ secrets.BITTENSOR_API_KEY_2 }}
        BITTENSOR_API_KEY_3: ${{ secrets.BITTENSOR_API_KEY_3 }}
        BITTENSOR_API_KEY_4: ${{ secrets.BITTENSOR_API_KEY_4 }}
        BITTENSOR_API_KEY_5: ${{ secrets.BITTENSOR_API_KEY_5 }}
        BITTENSOR_API_KEY_6: ${{ secrets.BITTENSOR_API_KEY_6 }}
        BRANCH_NAME: master
      run: |
        yarn install --immutable | grep -v 'YN0013'
        yarn ${{ matrix.step }}

    # cloudflare/pages-action no longer exists (404 on 2026-10-20); wrangler-action deploys to Pages the same way
    - name: Publish to Cloudflare Pages
      id: cloudflare_deployment
      uses: cloudflare/wrangler-action@v4.1.3
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        gitHubToken: ${{ secrets.GH_AUTOMATION_TOKEN }}
        wranglerVersion: '3'
        command: pages deploy ./packages/web-runner/build --project-name=${{ vars.CLOUDFLARE_PAGES_CRON_PROJECT_NAME }} --branch=${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || github.ref_name }}

    - name: Notify to Discord
      uses: sarisia/actions-status-discord@v1
      if: always()
      with:
        webhook: ${{ secrets.DISCORD_WEBHOOK }}
        status: ${{ job.status }}
        username: Extension Worker
        title: ${{ github.workflow }}
        description: |
          Web-runner-cron for middleware service is completed.
            - URL: ${{ steps.cloudflare_deployment.outputs.deployment-url }}
            - Alias: ${{ steps.cloudflare_deployment.outputs.pages-deployment-alias-url }}
